# Alembic configuration.
#
# Migrations are the authoritative mechanism for schema evolution. The database
# URL is resolved at runtime from the application configuration in env.py, so it
# is intentionally not hardcoded here.

[alembic]
script_location = database/migrations
prepend_sys_path = .
path_separator = os
# sqlalchemy.url is provided dynamically by env.py (from the config subsystem).

[post_write_hooks]
# Format generated migrations with Black for consistency with the codebase.
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -q
