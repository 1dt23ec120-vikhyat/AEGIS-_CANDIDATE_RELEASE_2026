# AI subsystem configuration (model paths, registry, and URL Intelligence Engine).
ai:
  models_dir: "models"
  model_registry_file: "models/registry.json"
  url_model_file: "url_lightgbm.txt"
  use_ml_analyzer: true

  suspicious_threshold: 0.35
  phishing_threshold: 0.70

  weight_ml: 1.0
  weight_heuristic: 0.8
  weight_reputation: 1.2
  weight_threat_intel: 1.5
  weight_domain: 0.9

  reputation_enabled: false
  reputation_timeout_seconds: 5.0
  cache_ttl_seconds: 3600
  redirect_max_depth: 10

  email_suspicious_threshold: 0.35
  email_phishing_threshold: 0.65
  weight_header: 0.9
  weight_authentication: 1.3
  weight_sender: 1.2
  weight_language: 1.0
  weight_attachment: 1.1
  weight_email_url: 1.4
